name: 部署到 GitHub Pages

# 一个站点放两个版本：
#   /LHXX/          正式版（main 分支）
#   /LHXX/explore/  大世界探索版（探索分支）
# 任一分支推送都会把两个版本一起重新构建，互不覆盖。
# Pages 只允许 main 部署，所以探索分支推送时只是去触发一次 main 上的这个工作流。
on:
  push:
    branches: [main, claude/project-thread-28rdj9]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPLORE_BRANCH: claude/project-thread-28rdj9

jobs:
  relay:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: 请 main 重新部署
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: main/package-lock.json
      - name: 构建正式版
        working-directory: main
        run: npm ci && npm run build
      - name: 取探索版分支
        id: explore
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPLORE_BRANCH }}
          path: explore
      - name: 构建探索版
        if: steps.explore.outcome == 'success'
        continue-on-error: true
        working-directory: explore
        run: npm ci && npm run build
      - name: 拼成一个站点
        run: |
          mkdir -p site
          cp -r main/dist/. site/
          if [ -f explore/dist/index.html ]; then
            mkdir -p site/explore
            cp -r explore/dist/. site/explore/
          fi
          ls site site/explore || true
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
